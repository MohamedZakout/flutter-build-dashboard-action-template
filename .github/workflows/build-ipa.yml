name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Dashboard build ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and optionally upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Validate input
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "::error::Invalid build ID"
            exit 1
          }

      - name: Request build configuration
        id: bootstrap
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          : "${DASHBOARD_URL:?Missing DASHBOARD_URL}"
          : "${DASHBOARD_API_TOKEN:?Missing DASHBOARD_API_TOKEN}"

          WORK="$RUNNER_TEMP/ios-build"
          mkdir -p "$WORK"
          CONFIG="$WORK/bootstrap.json"

          HTTP_CODE=$(curl -sS \
            -o "$CONFIG" \
            -w '%{http_code}' \
            -X POST \
            "${DASHBOARD_URL%/}/api/internal/builds/${BUILD_ID}/bootstrap" \
            -H "Authorization: Bearer ${DASHBOARD_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"run_id\":${GITHUB_RUN_ID},\"run_attempt\":${GITHUB_RUN_ATTEMPT}}") || {
              echo "::error::Bootstrap request failed"
              exit 1
            }

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Backend rejected bootstrap (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Expected bootstrap contract. Adapt these names to the real API.
          jq -e '
            (.build_mode == "build" or .build_mode == "build_upload") and
            (.source_repo | strings | test("^[^/]+/[^/]+$")) and
            (.source_branch | strings | length > 0) and
            (.source_token | strings | length > 0) and
            (.bundle_id | strings | length > 0) and
            (.team_id | strings | length > 0) and
            (.certificate_p12_base64 | strings | length > 0) and
            (.certificate_password | strings | length > 0) and
            (.provisioning_profile_base64 | strings | length > 0)
          ' "$CONFIG" >/dev/null || {
            echo "::error::Invalid or incomplete bootstrap response"
            exit 1
          }

          MODE=$(jq -r '.build_mode' "$CONFIG")
          echo "build_mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "Authorized build configuration received."

      - name: Checkout Flutter source
        shell: bash
        env:
          CONFIG_PATH: ${{ runner.temp }}/ios-build/bootstrap.json
        run: |
          set -euo pipefail

          REPO=$(jq -er '.source_repo' "$CONFIG_PATH")
          BRANCH=$(jq -er '.source_branch' "$CONFIG_PATH")
          TOKEN=$(jq -er '.source_token' "$CONFIG_PATH")

          echo "::add-mask::$TOKEN"

          # Use the temporary repository token supplied for this build.
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$BRANCH" \
            "https://github.com/${REPO}.git" source

          unset TOKEN AUTH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Apple signing assets
        id: signing
        shell: bash
        env:
          CONFIG_PATH: ${{ runner.temp }}/ios-build/bootstrap.json
        run: |
          set -euo pipefail
          umask 077

          CONFIG="$CONFIG_PATH"
          WORK="$RUNNER_TEMP/ios-build"

          KEYCHAIN="$WORK/build-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          jq -er '.certificate_p12_base64' "$CONFIG" |
            base64 --decode > "$WORK/distribution.p12"

          jq -er '.provisioning_profile_base64' "$CONFIG" |
            base64 --decode > "$WORK/profile.mobileprovision"

          CERT_PASSWORD=$(jq -er '.certificate_password' "$CONFIG")
          echo "::add-mask::$CERT_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$WORK/distribution.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security cms -D \
            -i "$WORK/profile.mobileprovision" \
            > "$WORK/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$WORK/profile.plist")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' "$WORK/profile.plist")

          PROFILE_TEAM=$(/usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' "$WORK/profile.plist")

          BUNDLE_ID=$(jq -er '.bundle_id' "$CONFIG")
          TEAM_ID=$(jq -er '.team_id' "$CONFIG")

          [[ "$PROFILE_TEAM" == "$TEAM_ID" ]] || {
            echo "::error::Provisioning profile Team ID mismatch"
            exit 1
          }

          # Support exact or wildcard application identifiers.
          case "$BUNDLE_ID" in
            ${PROFILE_APP_ID#"$TEAM_ID."})
              ;;
            *)
              PROFILE_BUNDLE=${PROFILE_APP_ID#"$TEAM_ID."}
              if [[ "$PROFILE_BUNDLE" != "$BUNDLE_ID" &&
                    "$PROFILE_BUNDLE" != "*" &&
                    "$PROFILE_BUNDLE" != *".*" ]]; then
                echo "::error::Provisioning profile Bundle ID mismatch"
                exit 1
              fi
              ;;
          esac

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$WORK/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"

          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$UUID" >> "$GITHUB_OUTPUT"

          unset CERT_PASSWORD KEYCHAIN_PASSWORD

      - name: Install Flutter dependencies
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get

      - name: Configure Xcode export
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-build"

          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' \
            "$RUNNER_TEMP/ios-build/ExportOptions.plist" 2>/dev/null || true

          cat > "$RUNNER_TEMP/ios-build/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ios-build/ExportOptions.plist"

          find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit |
            grep -q . || {
              echo "::error::IPA was not generated"
              exit 1
            }

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.build_id }}
          path: source/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Prepare App Store Connect API key
        if: steps.bootstrap.outputs.build_mode == 'build_upload'
        shell: bash
        env:
          CONFIG_PATH: ${{ runner.temp }}/ios-build/bootstrap.json
        run: |
          set -euo pipefail
          umask 077

          CONFIG="$CONFIG_PATH"
          WORK="$RUNNER_TEMP/ios-build"

          jq -e '
            (.app_store_connect_key_base64 | strings | length > 0) and
            (.app_store_connect_key_id | strings | length > 0) and
            (.app_store_connect_issuer_id | strings | length > 0)
          ' "$CONFIG" >/dev/null || {
            echo "::error::App Store Connect credentials are missing"
            exit 1
          }

          jq -er '.app_store_connect_key_base64' "$CONFIG" |
            base64 --decode > "$WORK/AuthKey.p8"

          # Fastlane API key JSON: keep the private key content in a
          # temporary file, not in the repository or workflow logs.
          jq -n \
            --arg key_id "$(jq -er '.app_store_connect_key_id' "$CONFIG")" \
            --arg issuer_id "$(jq -er '.app_store_connect_issuer_id' "$CONFIG")" \
            --rawfile key "$WORK/AuthKey.p8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$WORK/fastlane-api-key.json"

          chmod 600 "$WORK/AuthKey.p8" "$WORK/fastlane-api-key.json"

      - name: Setup Ruby
        if: steps.bootstrap.outputs.build_mode == 'build_upload'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        if: steps.bootstrap.outputs.build_mode == 'build_upload'
        run: gem install fastlane --no-document

      - name: Upload to TestFlight with Fastlane
        if: steps.bootstrap.outputs.build_mode == 'build_upload'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"

          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$RUNNER_TEMP/ios-build/fastlane-api-key.json" \
            --skip_waiting_for_build_processing

      - name: Cleanup signing credentials
        if: always()
        shell: bash
        run: |
          set +e

          security delete-keychain \
            "$RUNNER_TEMP/ios-build/build-signing.keychain-db"

          rm -f "$RUNNER_TEMP/ios-build/distribution.p12"
          rm -f "$RUNNER_TEMP/ios-build/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/ios-build/profile.plist"
          rm -f "$RUNNER_TEMP/ios-build/AuthKey.p8"
          rm -f "$RUNNER_TEMP/ios-build/fastlane-api-key.json"
          rm -f "$RUNNER_TEMP/ios-build/bootstrap.json"
          rm -rf "$RUNNER_TEMP/ios-build"
