name: Build iOS IPA

run-name: Build ${{ inputs.build_id }} [${{ inputs.correlation_id }}]

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build identifier persisted by the dashboard
        required: true
        type: string
      correlation_id:
        description: Correlation id used to verify the run
        required: true
        type: string

concurrency:
  group: ios-build-${{ inputs.build_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

jobs:
  build-ios:
    name: Build and optionally upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Bootstrap the build environment from the dashboard
        run: |
          set -euo pipefail
          umask 077

          : "${DASHBOARD_URL:?Missing DASHBOARD_URL secret}"

          WORK="$RUNNER_TEMP/ios-build"
          mkdir -p "$WORK"
          BOOTSTRAP="$WORK/bootstrap.json"

          BUILD_ID="${{ inputs.build_id }}"
          ENDPOINT="${DASHBOARD_URL%/}/${BUILD_ID}/bootstrap"
          echo "Bootstrap endpoint: $ENDPOINT"

          HTTP_CODE="$(curl -sS \
            -o "$BOOTSTRAP" \
            -w '%{http_code}' \
            -X POST \
            "$ENDPOINT" \
            -H "Authorization: Bearer ${{ secrets.BUILD_RUNNER_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"runId\":\"${{ github.run_id }}\",\"repository\":\"${{ github.repository }}\",\"runAttempt\":${{ github.run_attempt }}}")" || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Bootstrap failed with HTTP $HTTP_CODE"
            cat "$BOOTSTRAP" || true
            exit 1
          fi
          chmod 600 "$BOOTSTRAP"

          SOURCE_REPO="$(jq -r '.source.repository' "$BOOTSTRAP")"
          SOURCE_BRANCH="$(jq -r '.source.branch' "$BOOTSTRAP")"
          SOURCE_TOKEN="$(jq -r '.source.token' "$BOOTSTRAP")"
          BUNDLE_ID="$(jq -r '.signing.bundleId' "$BOOTSTRAP")"
          TEAM_ID="$(jq -r '.signing.teamId' "$BOOTSTRAP")"
          FLAVOR="$(jq -r '.signing.buildFlavor // empty' "$BOOTSTRAP")"
          TESTFLIGHT="$(jq -r '.signing.testflightEnabled' "$BOOTSTRAP")"
          CERT_PASSWORD="$(jq -r '.signing.certificatePassword' "$BOOTSTRAP")"

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "SOURCE_TOKEN=$SOURCE_TOKEN" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUILD_FLAVOR=$FLAVOR" >> "$GITHUB_ENV"
          echo "TESTFLIGHT_ENABLED=$TESTFLIGHT" >> "$GITHUB_ENV"
          echo "CERT_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"

          jq -r '.signing.certificateP12Base64' "$BOOTSTRAP" \
            | base64 --decode \
            > "$WORK/cert.p12"
          jq -r '.signing.provisioningProfileBase64' "$BOOTSTRAP" \
            | base64 --decode \
            > "$WORK/profile.mobileprovision"
          chmod 600 "$WORK/cert.p12" "$WORK/profile.mobileprovision"

          if jq -e '.signing.appStoreConnect != null' "$BOOTSTRAP" > /dev/null; then
            APP_STORE_KEY="$(jq -r '.signing.appStoreConnect.keyId' "$BOOTSTRAP")"
            APP_STORE_ISSUER="$(jq -r '.signing.appStoreConnect.issuerId' "$BOOTSTRAP")"
            jq -r '.signing.appStoreConnect.privateKey' "$BOOTSTRAP" \
              > "$WORK/AuthKey_$APP_STORE_KEY.p8"
            chmod 600 "$WORK/AuthKey_$APP_STORE_KEY.p8"
            echo "ASC_KEY_ID=$APP_STORE_KEY" >> "$GITHUB_ENV"
            echo "ASC_ISSUER_ID=$APP_STORE_ISSUER" >> "$GITHUB_ENV"
            echo "ASC_KEY_PATH=$WORK/AuthKey_$APP_STORE_KEY.p8" >> "$GITHUB_ENV"
          fi

          rm -f "$BOOTSTRAP"

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PLIST="$RUNNER_TEMP/ios-build/profile.plist"
          security cms -D -i "$RUNNER_TEMP/ios-build/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$PROFILE_PLIST")"
          cp "$RUNNER_TEMP/ios-build/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ios-build/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/ios-build/cert.p12" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Configure manual code signing
        run: |
          set -euo pipefail

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require "xcodeproj"

          project_path = "ios/Runner.xcodeproj"
          project = Xcodeproj::Project.open(project_path)

          runner = project.targets.find { |target| target.name == "Runner" }
          abort "Runner target not found in #{project_path}" unless runner

          configs = runner.build_configurations.select do |config|
            %w[Release Profile].include?(config.name)
          end

          abort "Runner Release configuration not found" unless
            configs.any? { |config| config.name == "Release" }

          configs.each do |config|
            settings = config.build_settings

            settings["CODE_SIGN_STYLE"] = "Manual"
            settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
            settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
            settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
            settings["PROVISIONING_PROFILE"] = ENV.fetch("PROFILE_UUID")
            settings["CODE_SIGNING_REQUIRED"] = "YES"
            settings["CODE_SIGNING_ALLOWED"] = "YES"
          end

          project.save
          puts "Configured manual code signing for the Runner target"
          RUBY

      - name: Build release IPA
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ios-build/exportOptions.plist"
          plutil -create xml1 "$EXPORT_PLIST"
          plutil -replace method -string "app-store-connect" "$EXPORT_PLIST"
          plutil -replace teamID -string "$TEAM_ID" "$EXPORT_PLIST"
          plutil -replace signingStyle -string "manual" "$EXPORT_PLIST"
          plutil -replace provisioningProfiles -json '{"'$BUNDLE_ID'" : "'$PROFILE_NAME'"}' "$EXPORT_PLIST"

          BUILD_ARGS=(build ipa --release --no-pub --export-options-plist="$EXPORT_PLIST")
          if [ -n "$BUILD_FLAVOR" ]; then
            BUILD_ARGS+=(--flavor "$BUILD_FLAVOR")
          fi
          flutter "${BUILD_ARGS[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.build_id }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: env.TESTFLIGHT_ENABLED == 'true' && env.ASC_KEY_ID != ''
        run: |
          set -euo pipefail
          IPATH="$(ls build/ios/ipa/*.ipa | head -n 1)"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/$(basename "$ASC_KEY_PATH")"
          xcrun altool --upload-app -f "$IPATH" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup signing credentials
        if: always()
        run: |
          set +e
          rm -f "$RUNNER_TEMP/ios-build/cert.p12"
          rm -f "$RUNNER_TEMP/ios-build/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/ios-build/AuthKey_"*.p8
          rm -f "$RUNNER_TEMP/ios-build/bootstrap.json"
          security delete-keychain "$RUNNER_TEMP/ios-build/build.keychain-db" 2>/dev/null
          rm -rf "$RUNNER_TEMP/ios-build"
